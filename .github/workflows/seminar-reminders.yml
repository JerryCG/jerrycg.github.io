name: Seminar reminders

on:
  schedule:
    # 15:00 UTC is 8:00 a.m. Pacific during daylight time and 7:00 a.m. during standard time.
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Email tomorrow's seminars
        shell: powershell
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: chengguojerry@gmail.com
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\seminar-reminders.ps1
